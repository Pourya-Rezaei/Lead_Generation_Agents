<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Local Lead Generation{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 1100px; padding: 1.5rem; color: #202124; }
    nav { display: flex; gap: 1rem; margin-bottom: 2rem; }
    nav a, a { color: #1457a6; }
    form { display: grid; gap: .75rem; max-width: 35rem; }
    label { font-weight: 600; }
    input, textarea, select, button { font: inherit; padding: .5rem; }
    button { cursor: pointer; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #d5d8dc; padding: .5rem; text-align: left; vertical-align: top; }
    .notice { background: #eef6ff; border-left: 4px solid #1457a6; padding: .75rem; }
    .error { background: #fff0f0; border-left: 4px solid #b42318; padding: .75rem; }
    .cards { display: flex; flex-wrap: wrap; gap: 1rem; }
    .card { border: 1px solid #d5d8dc; padding: 1rem; min-width: 10rem; }
  </style>
</head>
<body>
  <nav aria-label="Main navigation">
    <a href="/">Dashboard</a>
    <a href="/campaigns">Campaigns</a>
    <a href="/search">New search</a>
  </nav>
  {% if message %}<p class="notice">{{ message }}</p>{% endif %}
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  {% block content %}{% endblock %}
</body>
</html>
