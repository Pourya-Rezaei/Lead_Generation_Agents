<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="مدیریت و جمع‌آوری لیدهای کسب‌وکارهای محلی">
  <title>{% block title %}نقشهٔ لید{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark">ن</span>
        <span>نقشهٔ لید<small>جمع‌آوری هوشمند کسب‌وکارهای محلی</small></span>
      </a>
      <nav class="nav" aria-label="منوی اصلی">
        <a href="/">نمای کلی</a>
        <a href="/campaigns">کمپین‌ها</a>
        <a href="/search">جست‌وجوی جدید</a>
        <a href="/jobs">تاریخچهٔ اجرا</a>
        <a href="/sources">منابع و قراردادها</a>
      </nav>
    </header>
    {% if message %}<p class="notice">{{ message }}</p>{% endif %}
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    {% block content %}{% endblock %}
    <footer class="footer">اطلاعات این پنل از منابع عمومی کسب‌وکارها جمع‌آوری می‌شود.</footer>
  </div>
</body>
</html>
