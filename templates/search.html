{% extends "base.html" %}
{% block title %}جست‌وجوی جدید · نقشهٔ لید{% endblock %}
{% block content %}
<section class="hero"><span class="eyebrow">منبع فعال · Google Places</span><h1>پیدا کردن کسب‌وکارهای محلی</h1><p>حوزهٔ فعالیت و شهر را وارد کن تا اطلاعات عمومی کسب‌وکارها در کمپینت ذخیره شود.</p></section>
<div class="panel">
  <form method="post" action="/search" class="form-grid">
    <div class="field"><label for="query">حوزهٔ فعالیت یا شغل</label><input id="query" name="query" value="{{ form.query if form else '' }}" placeholder="مثلاً دندان‌پزشکی" required></div>
    <div class="field"><label for="location">شهر یا محدوده</label><input id="location" name="location" value="{{ form.location if form else '' }}" placeholder="مثلاً تهران" required></div>
    <div class="field"><label for="campaign_id">کمپین مقصد</label><select id="campaign_id" name="campaign_id" required>{% for campaign in campaigns %}<option value="{{ campaign.campaign_id }}" {% if form and form.campaign_id == campaign.campaign_id %}selected{% endif %}>{{ campaign.name }}</option>{% endfor %}</select></div>
    <div class="field"><label for="limit">حداکثر نتیجه</label><input id="limit" name="limit" type="number" min="1" max="100" value="{{ form.limit if form else 20 }}" required></div>
    <input type="hidden" name="source" value="places">
    <div class="full"><button class="btn" type="submit">اجرای جست‌وجو</button></div>
  </form>
</div>
{% endblock %}
