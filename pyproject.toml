[project]
name = "local-lead-generation"
version = "0.1.0"
description = "Modular local lead generation CLI"
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "pydantic>=2", "pydantic-settings>=2", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8", "respx>=0.21"]

[project.scripts]
leadgen = "leadgen.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
