apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-lead-generation
  labels:
    app.kubernetes.io/name: local-lead-generation
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: local-lead-generation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: local-lead-generation
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/your-org/local-lead-generation:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_PATH
              value: /data/leads.db
            - name: APIFY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: local-lead-generation-secrets
                  key: APIFY_API_TOKEN
          volumeMounts:
            - name: lead-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      volumes:
        - name: lead-data
          persistentVolumeClaim:
            claimName: local-lead-generation-data